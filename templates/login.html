<!DOCTYPE html>

<html>

<head>

    <title>Login - SMART PROP AI</title>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{

            height:100vh;

            overflow:hidden;

            display:flex;

            justify-content:center;

            align-items:center;
        }

        /* VIDEO BACKGROUND */

        .video-bg{

            position:fixed;

            top:0;
            left:0;

            width:100%;
            height:100%;

            object-fit:cover;

            z-index:-2;
        }

        /* DARK OVERLAY */

        .overlay{

            position:fixed;

            top:0;
            left:0;

            width:100%;
            height:100%;

            background:rgba(0,0,0,0.55);

            z-index:-1;
        }

        /* LOGIN CARD */

        .login-box{

            width:420px;

            padding:40px;

            border-radius:25px;

            background:rgba(255,255,255,0.12);

            backdrop-filter:blur(15px);

            box-shadow:0 0 25px rgba(0,0,0,0.4);

            color:white;

            animation:fadeIn 1s ease;
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(30px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .login-box h1{

            text-align:center;

            margin-bottom:30px;

            font-size:38px;
        }

        /* TABS */

        .login-tabs{

            display:flex;

            gap:10px;

            margin-bottom:25px;
        }

        .login-tabs button{

            flex:1;

            padding:12px;

            border:none;

            border-radius:10px;

            background:rgba(255,255,255,0.15);

            color:white;

            cursor:pointer;

            font-size:15px;

            transition:0.3s;
        }

        .active-tab{

            background:white !important;

            color:black !important;

            font-weight:bold;
        }

        /* INPUT GROUP */

        .input-group{

            margin-bottom:18px;
        }

        .input-group input{

            width:100%;

            padding:15px;

            border:none;

            border-radius:12px;

            outline:none;

            background:rgba(255,255,255,0.18);

            color:white;

            font-size:16px;
        }

        .input-group input::placeholder{

            color:#ddd;
        }

        /* BUTTON */

        .login-btn{

            width:100%;

            padding:15px;

            border:none;

            border-radius:12px;

            background:white;

            color:black;

            font-size:17px;

            font-weight:bold;

            cursor:pointer;

            transition:0.3s;
        }

        .login-btn:hover{

            transform:scale(1.03);
        }

        /* OTP BUTTONS */

        .otp-buttons{

            display:flex;

            gap:10px;
        }

        .small-btn{

            flex:1;

            padding:13px;

            border:none;

            border-radius:12px;

            background:white;

            color:black;

            font-size:15px;

            font-weight:bold;

            cursor:pointer;

            transition:0.3s;
        }

        .small-btn:hover{

            transform:scale(1.03);
        }

        /* TEXT */

        .bottom-text{

            text-align:center;

            margin-top:20px;

            color:#ddd;
        }

        .bottom-text a{

            color:white;

            text-decoration:none;

            font-weight:bold;
        }

        /* SUCCESS MESSAGE */

        .success-msg{

            text-align:center;

            margin-bottom:18px;

            color:#7CFC00;

            font-size:15px;
        }

        /* MOBILE */

        @media(max-width:500px){

            .login-box{

                width:90%;

                padding:30px 20px;
            }

            .login-box h1{

                font-size:30px;
            }
        }

    </style>

</head>

<body>

    <!-- VIDEO -->

    <video
        autoplay
        muted
        loop
        playsinline
        class="video-bg"
    >

        <source
            src="{{ url_for('static', filename='videos/house.mp4') }}"
            type="video/mp4"
        >

    </video>

    <!-- OVERLAY -->

    <div class="overlay"></div>

    <!-- LOGIN BOX -->

    <div class="login-box">

        <h1>

            Welcome Back

        </h1>

        <!-- TABS -->

        <div class="login-tabs">

            <button
                type="button"
                id="passwordTab"
                class="active-tab"
                onclick="showPasswordLogin()"
            >

                Password Login

            </button>

            <button
                type="button"
                id="otpTab"
                onclick="showOtpLogin()"
            >

                OTP Login

            </button>

        </div>

        <!-- PASSWORD LOGIN -->

        <form
            method="POST"
            id="passwordForm"
        >

            <input
                type="hidden"
                name="login_type"
                value="password"
            >

            <div class="input-group">

                <input
                    type="email"
                    name="email"
                    placeholder="Enter Email"
                    required
                >

            </div>

            <div class="input-group">

                <input
                    type="password"
                    name="password"
                    placeholder="Enter Password"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-btn"
            >

                Login

            </button>

        </form>

        <!-- OTP LOGIN -->

        <form
            method="POST"
            id="otpForm"
            style="display:none;"
        >

            <input
                type="hidden"
                name="login_type"
                value="otp"
            >

            <!-- SUCCESS -->

            {% if otp_sent %}

            <div class="success-msg">

                OTP Sent Successfully

            </div>

            {% endif %}

            <!-- EMAIL -->

            <div class="input-group">

                <input
                    type="email"
                    name="otp_email"
                    placeholder="Enter Email"
                    value="{{ otp_email if otp_email else '' }}"
                    required
                >

            </div>

            <!-- OTP -->

            {% if otp_sent %}

            <div class="input-group">

                <input
                    type="text"
                    name="otp"
                    placeholder="Enter OTP"
                    required
                >

            </div>

            {% endif %}

            <!-- BUTTONS -->

            <div class="otp-buttons">

                <!-- SEND OTP BUTTON -->

                {% if not otp_sent %}

                <button
                    type="submit"
                    class="small-btn"
                >

                    Send OTP

                </button>

                {% endif %}

                <!-- LOGIN BUTTON -->

                {% if otp_sent %}

                <button
                    type="submit"
                    class="small-btn"
                >

                    Login

                </button>

                {% endif %}

            </div>

        </form>

        <!-- SIGNUP -->

        <div class="bottom-text">

            Don't have an account?

            <a href="/signup">

                Signup

            </a>

        </div>

    </div>

    <!-- JAVASCRIPT -->

    <script>

        function showPasswordLogin(){

            document.getElementById('passwordForm').style.display = 'block';

            document.getElementById('otpForm').style.display = 'none';

            document.getElementById('passwordTab').classList.add('active-tab');

            document.getElementById('otpTab').classList.remove('active-tab');
        }

        function showOtpLogin(){

            document.getElementById('passwordForm').style.display = 'none';

            document.getElementById('otpForm').style.display = 'block';

            document.getElementById('otpTab').classList.add('active-tab');

            document.getElementById('passwordTab').classList.remove('active-tab');
        }

        // KEEP OTP TAB ACTIVE AFTER OTP SENT

        {% if otp_sent %}

        showOtpLogin();

        {% endif %}

    </script>

</body>

</html>
